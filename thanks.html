<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent | Timothy D. Spivey</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0d1b2a 0%, #16293d 60%, #223b52 100%);
      color: #fff; text-align: center; padding: 2rem;
    }
    .card { max-width: 460px; }
    .check {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      border: 2px solid #e2c84b; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .check svg { width: 30px; color: #e2c84b; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: .75rem; }
    p { color: rgba(255,255,255,.75); line-height: 1.65; margin-bottom: 2rem; }
    a {
      display: inline-block; text-decoration: none;
      background: #b8970a; color: #0d1b2a; font-weight: 600; font-size: .9rem;
      padding: .75rem 1.75rem; border-radius: 8px; transition: background .2s;
    }
    a:hover { background: #e2c84b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1>Message Sent</h1>
    <p>Thank you for reaching out. Your message is on its way, and I'll get back to you as soon as I can.</p>
    <a href="/">&larr; Back to the site</a>
  </div>
</body>
