# --- Dissertation essays (in essay order) ------------------------------------
- title: "Records Are Not Events: Disclosure Timing, Regulatory Status, and Market Reactions to Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    Public breach databases record notifications, not incidents: one breach
    can appear many times, filing dates can stand in for breach dates, and
    industry codes stand in for regulatory status. This essay rebuilds the
    data at the event level, takes regulatory status from the FCC's Form 499
    registry, and compares breaches at carriers subject to the FCC's 2007
    breach rule with breaches at other public firms to show how those
    measurement choices shape estimated market reactions to breaches.
  url: ""
  featured: true

- title: "Codes Are Not Coverage: Industry Classification, Regulatory Status, and Return Volatility After Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    Research on regulated firms often identifies them by industry code, but an
    industry code says what a firm does, not which rules it must follow. This
    essay shows that no industry-code convention reproduces the firms
    registered with the FCC as telecommunications carriers; the convention
    drawn from published practice finds only half of the regulated parent
    firms. Using the Form 499 registry and event-level breach data, it tests
    whether being subject to the FCC's breach rule changes return volatility
    after a breach is disclosed, and shows how a volatility pattern that
    industry codes produce shrinks under registry-verified treatment.
  url: ""
  featured: false

- title: "Answering to the FCC: Regulatory Status and Executive Departures After Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    A regulator is a stakeholder with power and legitimacy, and a breach makes
    that relationship urgent. This essay asks whether boards at FCC-regulated
    carriers are more or less likely than boards at other public firms to see
    an executive officer depart after a breach. It distinguishes executive
    departures from mere Item 5.02 filings using a classifier validated
    against blind reference codes, and measures departures within 30, 90, and
    180 days of public notification.
  url: ""
  featured: false

