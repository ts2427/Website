# --- Dissertation essays (in essay order) ------------------------------------
- title: "Records Are Not Events: Disclosure Timing, Regulatory Status, and Market Reactions to Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    Public breach databases record notifications, not incidents. One breach
    can appear many times, filing dates can stand in for breach dates, and
    industry codes stand in for regulatory status. This essay rebuilds the
    data at the event level, collapsing 1,054 notification records into 489
    breaches, and takes regulatory status from the FCC's Form 499 registry.
    It then compares breaches at carriers subject to the FCC's breach
    notification rule with breaches at other public firms. Neither regulatory
    status, disclosure timing, breach history, nor health-data exposure is
    associated with the 30-day market reaction. The data also show that the
    standard timing measure cannot test whether faster disclosure matters,
    because most breaches coded as "fast" carry a filing date in place of a
    breach date.
  url: ""
  featured: true

- title: "Codes Are Not Coverage: Industry Classification, Regulatory Status, and Return Volatility After Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    Research on regulated firms often identifies them by industry code, but an
    industry code says what a firm does, not which rules it must follow. This
    essay shows that no industry-code convention reproduces the firms
    registered with the FCC as telecommunications carriers. The convention
    drawn from published practice finds only half of the regulated parent
    firms. Using the Form 499 registry and event-level breach data, the essay
    finds that regulated status predicts neither disclosure delay nor the
    change in return volatility after a breach is disclosed. A size pattern in
    volatility that industry codes produce shrinks under registry-verified
    treatment and reverses once breaches are counted as events, not
    notifications.
  url: ""
  featured: false

- title: "Filings Are Not Departures: Regulatory Status and Leadership Change After Data Breaches"
  authors: ["Spivey, T. D."]
  year: 2026
  stream: disclosure
  kind: dissertation_essay
  status: working_paper
  venue: ""
  abstract: >-
    A regulator is a stakeholder with power and legitimacy, and a breach makes
    that relationship urgent. This essay asks whether boards at FCC-regulated
    carriers are more or less likely than boards at other public firms to see
    an executive officer depart after a breach. It separates actual departures
    from routine Item 5.02 filings, using a classifier validated against blind
    reference codes. At 180 days, two thirds of breaches at other firms are
    followed by an Item 5.02 filing, but only a quarter by an executive
    departure. Measured within 30, 90, and 180 days of public notification,
    departure rates at regulated carriers do not differ from those at other
    firms, and the design rules out large effects.
  url: ""
  featured: false

